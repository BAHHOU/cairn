packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: false
  '@parcel/watcher': false
  '@swc/core': false
  # Prisma only appears as an optional peer of better-auth/drizzle-orm. Its engines are downloaded
  # from binaries.prisma.sh, which the corporate proxy blocks (407). We do not use Prisma.
  '@prisma/engines': false
  prisma: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.119'
  - '@ai-sdk/openai-compatible@3.0.74'
  - '@ai-sdk/provider-utils@5.0.64'
  - '@ai-sdk/provider@4.0.31'
  - ai@7.0.146
